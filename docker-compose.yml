services:
  postgres:
    image: postgres:16
    container_name: mieszkania-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mieszkania
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docs/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

volumes:
  postgres_data:
